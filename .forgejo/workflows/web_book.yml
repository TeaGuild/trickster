name: Publish Web Book
on:
  push:
    branches:
      - mistress
jobs:
  publish_web_book:
    runs-on: gaming
    env:
      COLEUS_BOOK_GEN: 'true'
      COLEUS_BOOK_ID: 'trickster:tome_of_tomfoolery'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'temurin'
      - name: Fetch apt repos
        run: sudo apt-get update
      - name: Generate Book
        uses: https://github.com/modmuss50/xvfb-action@v1
        with:
          run: ./gradlew runClient --stacktrace
      # - name: Deploy
      #   if: github.ref == 'refs/heads/master'
      #   uses: peaceiris/actions-gh-pages@v4
      #   with:
      #     github_token: ${{ secrets.GITHUB_TOKEN }}
      #     publish_dir: ./run/coleus/trickster/tome_of_tomfoolery
      - name: Deploy to staticinator
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          tar -czvf "./archive.tar.gz" -C "./run/coleus/trickster/tome_of_tomfoolery" .
          curl -F "file=@./archive.tar.gz" -H "Token: $TOKEN" -H "Target-Host: $HOST" "https://deploy.enjarai.dev/update" -v

      # - name: Upload Site Artifact
